# Color Variant Buttons
# Category: R+1-4, G+1-4, B+1-4, W+1-4 (16 total)
# Using custom PT2262 component

button:
  # ========================================
  # Red Variants
  # ========================================

  - platform: template
    name: "R+1"
    id: r_plus_1
    icon: "mdi:palette-advanced"
    on_press:
      - pt2262.send:
          id: rf_transmitter
          code: "0X00Z1XZ00XZ"

