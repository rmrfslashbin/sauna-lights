# DIY Mode Buttons
# Category: DIY1-6 (6 custom preset modes)
# Using custom PT2262 component

button:
  # ========================================
  # DIY Presets
  # ========================================

  - platform: template
    name: "DIY1"
    id: diy1
    icon: "mdi:palette-outline"
    on_press:
      - pt2262.send:
          id: rf_transmitter
          code: "0X00Z1XZ0X0Z"

