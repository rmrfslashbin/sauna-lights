# ESPHome Configuration for Sauna Lights RF Controller
# ESP32-S3 based 433MHz transmitter for LED remote control

# Import device constants and secrets
substitutions:
  <<: !include consts.yaml

# External components (local PT2262 component)
external_components:
  - source:
      type: local
      path: external_components
    components: [pt2262]

# Core ESPHome configuration
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_comment}

# ESP32-S3 specific configuration
esp32:
  board: ${board_type}
  framework:
    type: esp-idf  # Better performance than Arduino framework
    version: recommended

# Enable logging (DEBUG for initial testing)
logger:
  level: DEBUG
  baud_rate: 115200

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# Safe mode configuration
safe_mode:
  num_attempts: 3
  reboot_timeout: 10min

# WiFi configuration with fallback AP
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# mDNS (for .local hostname discovery)
mdns:
  disabled: false

# Web server for debugging
web_server:
  port: 80
  version: 2
  include_internal: true

# Time synchronization
time:
  - platform: homeassistant
    id: homeassistant_time

# Status LED (onboard RGB on GPIO38)
light:
  - platform: status_led
    name: "Status LED"
    id: status_light
    pin: GPIO38
    internal: false

# ============================================================================
# RF TRANSMITTER CONFIGURATION (Core Functionality)
# ============================================================================

# Custom PT2262 component for proper tri-state encoding
pt2262:
  id: rf_transmitter
  pin: GPIO4
  repeat: 4  # Match original remote (verified from RTL_433 captures)

# Keep remote_transmitter for reference (currently unused)
# remote_transmitter:
#   pin: GPIO4
#   carrier_duty_percent: 100%
#   non_blocking: true

# ============================================================================
# BUTTON SERVICES (All 44 Buttons - Organized by Category)
# ============================================================================
# Signal parameters from RTL_433 captures:
#   Short pulse: 420µs (measured: 432µs)
#   Long pulse: 1216µs (measured: 1272µs)
#   Sync gap: 12048µs (measured: 12192µs)
#   Gap: 1224µs (measured: 1244µs)
#
# PT2262 tri-state encoding (sent directly as symbols, not binary):
#   0 = short/short pulse pair
#   1 = long/long pulse pair
#   X = long/short pulse pair (FLOAT)
#   Z = short/long pulse pair
#
# Button organization:
#   - power_basic.yaml: Power, Brightness Up/Down, Fast Forward (4 buttons)
#   - colors_primary.yaml: Red, Green, Blue, White (4 buttons)
#   - colors_variants.yaml: R+1-4, G+1-4, B+1-4, W+1-4 (16 buttons)
#   - colors_adjust.yaml: R-Up/Dn, G-Up/Dn, B-Up/Dn (6 buttons)
#   - speed.yaml: Quick, Slow (2 buttons)
#   - diy.yaml: DIY1-6 (6 buttons)
#   - effects.yaml: Auto, Flash, Jump3/7, Fade3/7 (6 buttons)
#   - system.yaml: Restart, Factory Reset, Safe Mode (3 buttons)
# ============================================================================

# Import button configurations as packages
# All 44 buttons enabled with PT2262 component
packages:
  buttons_power: !include buttons/power_basic.yaml
  buttons_colors: !include buttons/colors_primary.yaml
  buttons_diy: !include buttons/diy.yaml
  buttons_system: !include buttons/system.yaml
  buttons_variants: !include buttons/colors_variants.yaml
  buttons_adjust: !include buttons/colors_adjust.yaml
  buttons_speed: !include buttons/speed.yaml
  buttons_effects: !include buttons/effects.yaml

# ============================================================================
# DIAGNOSTIC SENSORS (Standard Monitoring)
# ============================================================================

sensor:
  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    icon: "mdi:wifi"

  # Uptime
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    icon: "mdi:clock-outline"

  # Internal Temperature (ESP32-S3 built-in)
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
    icon: "mdi:thermometer"

text_sensor:
  # Device Info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: "mdi:ip-network"
    ssid:
      name: "Connected SSID"
      icon: "mdi:wifi"
    bssid:
      name: "Connected BSSID"
      icon: "mdi:wifi-star"
    mac_address:
      name: "MAC Address"
      icon: "mdi:network-outline"

  # ESPHome Build Version (version number only - e.g., "2026.1.3")
  - platform: template
    name: "ESPHome Build Version"
    id: esphome_build_version
    icon: "mdi:numeric"
    entity_category: diagnostic
    lambda: |-
      return std::string(ESPHOME_VERSION);

  # ESPHome Config Hash (configuration fingerprint for detecting changes)
  - platform: template
    name: "ESPHome Config Hash"
    id: esphome_config_hash
    icon: "mdi:fingerprint"
    entity_category: diagnostic
    lambda: |-
      std::string build_time = std::string(__DATE__) + " " + std::string(__TIME__);
      uint32_t hash = 0;
      for (char c : build_time) {
        hash = hash * 31 + c;
      }
      return std::string("0x") + str_sprintf("%08x", hash);

  # Firmware Build Date (human-readable date)
  - platform: template
    name: "Firmware Build Date"
    id: firmware_build_date
    icon: "mdi:calendar-clock"
    entity_category: diagnostic
    lambda: |-
      return std::string(__DATE__);

  # Firmware Build Time (human-readable time)
  - platform: template
    name: "Firmware Build Time"
    id: firmware_build_time
    icon: "mdi:clock-outline"
    entity_category: diagnostic
    lambda: |-
      return std::string(__TIME__);

# Status Binary Sensor
binary_sensor:
  - platform: status
    name: "Status"
    icon: "mdi:check-circle"

